name: Agente Atencion Correo EqualEdu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ejecutar-agente:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Ejecutar Agente de Correo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          SUPERVISOR_EMAIL: ${{ secrets.SUPERVISOR_EMAIL }}
        run: python agente_correo.py
