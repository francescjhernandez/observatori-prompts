<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observatori d'Igualtat Educativa Inclusiva - Prompts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CAPÇALERA I SELECTOR D'IDIOMA -->
    <header class="main-header">
        <div class="header-container">
            <h1>Observatori d'Igualtat Educativa Inclusiva</h1>
            <p class="subtitle">Banc de prompts per a la generació de guies docents i inclusió educativa</p>
            
            <!-- Selector d'idiomes -->
            <div class="language-selector">
                <button id="btn-ca" class="lang-btn">CA</button>
                <button id="btn-es" class="lang-btn">ES</button>
                <button id="btn-pt" class="lang-btn">PT</button>
                <button id="btn-en" class="lang-btn">EN</button>
            </div>
        </div>
    </header>

    <main class="main-content">

        <!-- BARRA D'EINES: DESCÀRREGA DE FORMULARI I CERCA -->
        <section class="toolbar-section">
            <div class="toolbar-container">
                
                <!-- Enllaç dinàmic per a descarregar el formulari de context -->
                <div class="download-box">
                    <a id="btn-download-form" href="#" target="_blank" class="btn-download">
                        📥 Descarregar formulari de context
                    </a>
                </div>

                <!-- Cerca de prompts -->
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Buscar prompt per títol, categoria o contingut...">
                </div>

            </div>
        </section>

        <!-- CONTENIDOR DE TARGETES DE PROMPTS -->
        <section class="prompts-section">
            <div id="prompts-container" class="prompts-grid">
                <p class="loading-text">Carregant prompts...</p>
            </div>
        </section>

    </main>

    <footer class="main-footer">
        <p>&copy; Universitat de València - Observatori d'Igualtat Educativa Inclusiva</p>
    </footer>

    <!-- SCRIPT PRINCIPAL -->
    <script src="script.js"></script>
</body>
</html>
